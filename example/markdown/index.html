<!DOCTYPE html>
<html>
<head>
  <duanly-import src="head">
    <duanly-template name="title">Markdown | Duanly | the little static site generator</duanly-template>
  </duanly-import>
</head>

<body>
  <duanly-import src="header">
    <p>Knowledge of markdown is often a requirement for static site generators, but Duanly treats markdown as an opt-in feature. So if you'd like to format some or all of your content in markdown, here's how to do it:</p>
  </duanly-import>

  <main class="insulate">
    <div class="wrapper content">
      <duanly-import src="markdown" as="markdown" />
    </div>
  </main>

  <duanly-import src="footer" />
</body>
</html>
